<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETPULSE — Device Test</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Ccircle cx='30' cy='30' r='30' fill='%23000'/%3E%3Cpath d='M 9 40 A 23 23 0 0 1 51 40' fill='none' stroke='%231e1e1e' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M 9 40 A 23 23 0 0 1 51 40' fill='none' stroke='%2300f5a0' stroke-width='5' stroke-linecap='round' stroke-dasharray='72' stroke-dashoffset='18'/%3E%3Cline x1='30' y1='30' x2='30' y2='12' stroke='%2300f5a0' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='30' cy='30' r='4' fill='%2300f5a0'/%3E%3Ccircle cx='30' cy='30' r='2' fill='%23000'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--panel:#111;--panel2:#161616;
  --border:#222;--border2:#2a2a2a;
  --accent:#00f5a0;--accent-dim:rgba(0,245,160,0.12);--accent-glow:0 0 22px rgba(0,245,160,0.35);
  --good:#00f5a0;--warn:#ffb800;--danger:#ff3d3d;
  --good-dim:rgba(0,245,160,0.12);--warn-dim:rgba(255,184,0,0.12);--danger-dim:rgba(255,61,61,0.12);
  --white:#fff;--grey1:#ccc;--grey2:#888;--grey3:#444;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:#000;}
body{background:var(--bg);color:var(--white);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 48px;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#1e1e1e 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;}
.container{position:relative;z-index:1;width:100%;max-width:680px;}

/* HEADER */
header{text-align:center;margin-bottom:22px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.logo-row{display:flex;align-items:center;gap:16px;}
.logo-icon{width:60px;height:60px;flex-shrink:0;}
@keyframes needleLive{0%{transform:rotate(-80deg)}20%{transform:rotate(10deg)}35%{transform:rotate(-30deg)}55%{transform:rotate(50deg)}70%{transform:rotate(20deg)}85%{transform:rotate(60deg)}100%{transform:rotate(-80deg)}}
@keyframes arcPulse{0%,100%{stroke:#00f5a0;filter:drop-shadow(0 0 3px #00f5a0)}55%{stroke:#00ffa8;filter:drop-shadow(0 0 10px #00f5a0)}}
@keyframes dotBreath{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes ringRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.speedo-needle{transform-origin:50% 72%;animation:needleLive 3.2s cubic-bezier(0.4,0,0.2,1) infinite;}
.speedo-arc{animation:arcPulse 3.2s ease-in-out infinite;}
.speedo-dot{animation:dotBreath 1.6s ease-in-out infinite;}
.speedo-ring{transform-origin:50% 50%;animation:ringRotate 8s linear infinite;opacity:0.3;}
.logo-text{display:flex;flex-direction:column;align-items:flex-start;}
.logo-main{font-size:2.1rem;font-weight:700;letter-spacing:7px;line-height:1;color:var(--white);}
.logo-main span{color:var(--accent);text-shadow:var(--accent-glow);}
.logo-sub{font-family:'Share Tech Mono',monospace;font-size:0.58rem;letter-spacing:3px;color:var(--grey3);text-transform:uppercase;margin-top:2px;}

/* BACK BUTTON */
.back-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border2);color:var(--grey2);border-radius:8px;padding:7px 14px;font-family:'Share Tech Mono',monospace;font-size:0.65rem;letter-spacing:2px;cursor:pointer;text-decoration:none;transition:all 0.2s;margin-bottom:14px;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}

/* BENCHMARK CARD */
.bench-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:24px 20px 20px;margin-bottom:12px;text-align:center;position:relative;overflow:hidden;}
.bench-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.bench-title{font-size:0.68rem;letter-spacing:4px;color:var(--grey3);text-transform:uppercase;font-family:'Share Tech Mono',monospace;margin-bottom:16px;}

/* GHz METER */
.ghz-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:20px;}
.ghz-ring{position:relative;width:160px;height:160px;margin-bottom:12px;}
.ghz-ring svg{width:100%;height:100%;}
.ghz-track{fill:none;stroke:#1e1e1e;stroke-width:10;stroke-linecap:round;}
.ghz-fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;stroke-dasharray:408;stroke-dashoffset:408;transition:stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1),stroke 0.4s;filter:drop-shadow(0 0 6px var(--accent));}
.ghz-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ghz-val{font-size:2rem;font-weight:700;color:var(--white);font-family:'Share Tech Mono',monospace;line-height:1;}
.ghz-unit{font-size:0.62rem;color:var(--grey2);letter-spacing:3px;font-family:'Share Tech Mono',monospace;margin-top:2px;}
.ghz-label{font-size:0.65rem;color:var(--grey3);letter-spacing:3px;font-family:'Share Tech Mono',monospace;}

/* PROGRESS */
.bench-progress{height:2px;background:var(--border);border-radius:2px;margin:10px 0 16px;overflow:hidden;}
.bench-progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),rgba(0,245,160,0.4));border-radius:2px;width:0%;transition:width 0.4s;box-shadow:0 0 6px var(--accent);}
.bench-status{font-family:'Share Tech Mono',monospace;font-size:0.68rem;color:var(--grey3);letter-spacing:2px;margin-bottom:14px;}

/* SCORE BADGES */
.score-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px;}
.score-box{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;}
.score-label{font-family:'Share Tech Mono',monospace;font-size:0.55rem;color:var(--grey3);letter-spacing:2px;text-transform:uppercase;}
.score-val{font-size:1.3rem;font-weight:700;font-family:'Share Tech Mono',monospace;margin:4px 0 2px;}
.score-val.good{color:var(--good);text-shadow:0 0 10px rgba(0,245,160,0.4);}
.score-val.ok{color:var(--warn);}
.score-val.bad{color:var(--danger);}
.score-sub{font-family:'Share Tech Mono',monospace;font-size:0.55rem;color:var(--grey3);}

/* RUN BUTTON */
.btn-run{background:var(--accent);color:#000;border:none;border-radius:10px;padding:12px 40px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;letter-spacing:4px;cursor:pointer;text-transform:uppercase;transition:all 0.2s;box-shadow:var(--accent-glow);width:100%;max-width:260px;display:block;margin:0 auto;}
.btn-run:hover:not(:disabled){background:#00ffa8;box-shadow:0 0 36px rgba(0,245,160,0.55);transform:translateY(-2px);}
.btn-run:disabled{background:#222;color:#444;box-shadow:none;cursor:not-allowed;}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(0,245,160,0.45)}70%{box-shadow:0 0 0 14px rgba(0,245,160,0)}100%{box-shadow:0 0 0 0 rgba(0,245,160,0)}}
.btn-run.pulsing{animation:pulse-ring 1.4s infinite;}

/* VERDICT */
.verdict-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:8px;font-size:0.85rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:12px;}
.verdict-chip.good{background:var(--good-dim);color:var(--good);border:1px solid rgba(0,245,160,0.25);}
.verdict-chip.ok{background:var(--warn-dim);color:var(--warn);border:1px solid rgba(255,184,0,0.25);}
.verdict-chip.bad{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(255,61,61,0.25);}

/* SPECS GRID */
.specs-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px;}
.specs-title{font-size:0.6rem;letter-spacing:3px;color:var(--grey3);text-transform:uppercase;font-family:'Share Tech Mono',monospace;margin-bottom:14px;}
.specs-section{margin-bottom:14px;}
.specs-section-label{font-size:0.58rem;letter-spacing:3px;color:var(--accent);text-transform:uppercase;font-family:'Share Tech Mono',monospace;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.spec-row{display:flex;align-items:flex-start;justify-content:space-between;padding:7px 0;border-bottom:1px solid #151515;gap:12px;}
.spec-row:last-child{border-bottom:none;}
.spec-key{font-family:'Share Tech Mono',monospace;font-size:0.65rem;color:var(--grey2);min-width:120px;flex-shrink:0;}
.spec-val{font-family:'Share Tech Mono',monospace;font-size:0.68rem;color:var(--white);font-weight:600;text-align:right;word-break:break-word;}
.spec-val.accent{color:var(--accent);}
.spec-val.warn{color:var(--warn);}
.spec-val.muted{color:var(--grey3);}

/* BATTERY BAR */
.battery-inline{display:inline-flex;align-items:center;gap:8px;}
.battery-bar-wrap{width:50px;height:8px;background:#1a1a1a;border-radius:4px;overflow:hidden;border:1px solid #2a2a2a;}
.battery-bar{height:100%;border-radius:4px;transition:width 1s ease;}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}
.ldot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--grey3);animation:blink 1s infinite;}
footer{text-align:center;font-family:'Share Tech Mono',monospace;font-size:0.57rem;color:var(--grey3);margin-top:20px;letter-spacing:3px;}
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <header>
    <div class="logo-row">
      <svg class="logo-icon" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="iglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <radialGradient id="ibg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1c1c1c"/><stop offset="100%" stop-color="#080808"/></radialGradient>

        <path d="M 9 40 A 23 23 0 0 1 51 40" fill="none" stroke="#1e1e1e" stroke-width="5" stroke-linecap="round"/>
        <path class="speedo-arc" d="M 9 40 A 23 23 0 0 1 51 40" fill="none" stroke="#00f5a0" stroke-width="5" stroke-linecap="round" stroke-dasharray="72" stroke-dashoffset="18"/>
        <circle cx="11" cy="34" r="1.8" fill="#ff3d3d" opacity="0.8"/>
        <circle cx="18" cy="16" r="1.8" fill="#ffb800" opacity="0.8"/>

        <line x1="13" y1="21" x2="17" y2="24" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

      <div class="logo-text">

  </header>

  <a class="back-btn" href="speedtest.html">← BACK TO SPEED TEST</a>

  <!-- BENCHMARK CARD -->
  <div class="bench-card">
    <div class="bench-title">// CPU PERFORMANCE BENCHMARK</div>

    <div class="ghz-wrap">
      <div class="ghz-ring">
        <svg viewBox="0 0 160 160">
          <circle class="ghz-track" cx="80" cy="80" r="65"/>
          <circle class="ghz-fill" id="ghzFill" cx="80" cy="80" r="65" transform="rotate(-90 80 80)"/>
        </svg>
        <div class="ghz-center">
          <div class="ghz-val" id="ghzVal">--</div>

    <div class="bench-progress"><div class="bench-progress-bar" id="benchProg"></div></div>
    <div class="bench-status" id="benchStatus">IDLE</div>

    <div class="score-row">
      <div class="score-box">
        <div class="score-label">SINGLE</div>
        <div class="score-val" id="scoreSingle">--</div>

      </div>
      <div class="score-box">
        <div class="score-label">MULTI</div>
        <div class="score-val" id="scoreMulti">--</div>
        <div class="score-sub">core score</div>
      </div>
      <div class="score-box">
        <div class="score-label">MEMORY</div>
        <div class="score-val" id="scoreMem">--</div>
        <div class="score-sub">MB/s</div>
      </div>
    </div>

    <div id="benchVerdict" style="margin-top:4px;"></div>
    <br>
    <button class="btn-run pulsing" id="btnRun" onclick="runBenchmark()">▶ RUN BENCHMARK</button>
  </div>

  <!-- SPECS CARD -->
  <div class="specs-card">
    <div class="specs-title">// DEVICE SPECIFICATIONS</div>
    <div id="specsContainer"><div style="font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--grey3);text-align:center;padding:20px 0;">Scanning device... <span class="ldot"></span></div></div>
  </div>

</div>
<footer>NETPULSE v2.2 &nbsp;•&nbsp; BUILT BY SYNCRODEV</footer>

<script>
// ═══ BENCHMARK ════════════════════════════════════════════════════════════

// Single-core: how many math ops per second (prime sieve)
function benchSingleCore(durationMs = 1200) {
  const t0 = performance.now();
  let ops = 0;
  while (performance.now() - t0 < durationMs) {
    // Sieve of Eratosthenes up to 2000
    const limit = 2000;
    const sieve = new Uint8Array(limit + 1);
    for (let i = 2; i <= limit; i++) {
      if (!sieve[i]) {
        for (let j = i * 2; j <= limit; j += i) sieve[j] = 1;
      }
    }
    ops++;
  }
  return ops;
}

// Memory bandwidth: fill + read large typed array
function benchMemory() {
  const SIZE = 16 * 1024 * 1024; // 16M floats = 64MB
  const arr  = new Float32Array(SIZE);
  const t0   = performance.now();
  for (let i = 0; i < SIZE; i++) arr[i] = i * 1.1;
  let sum = 0;
  for (let i = 0; i < SIZE; i++) sum += arr[i];
  const ms = performance.now() - t0;
  // bytes transferred (write + read) in MB/s
  return Math.round((SIZE * 4 * 2) / (ms / 1000) / 1e6);
}

// Multi-core: run N workers in parallel using Promise.all + inline Worker
function benchMultiCore(cores, durationMs = 1200) {
  const workerCode = `
    self.onmessage = function(e) {
      const dur = e.data;
      const t0 = performance.now();
      let ops = 0;
      while (performance.now() - t0 < dur) {
        const limit = 2000, sieve = new Uint8Array(limit + 1);
        for (let i = 2; i <= limit; i++) {
          if (!sieve[i]) for (let j = i*2; j <= limit; j += i) sieve[j] = 1;
        }
        ops++;
      }
      self.postMessage(ops);
    };
  `;
  const blob = new Blob([workerCode], {type:'application/javascript'});
  const url  = URL.createObjectURL(blob);

  const workers = Array.from({length: cores}, () => {
    return new Promise(res => {
      const w = new Worker(url);
      w.onmessage = e => { w.terminate(); res(e.data); };
      w.postMessage(durationMs);
    });
  });

  return Promise.all(workers).then(results => {
    URL.revokeObjectURL(url);
    return results.reduce((a, b) => a + b, 0);
  });
}

// Convert ops score → estimated GHz (calibrated heuristic)
// ~500 ops/s on a ~3 GHz desktop, ~150 ops/s on a ~2 GHz mobile
function opsToGhz(ops) {
  return Math.min(Math.max((ops / 500) * 3.0, 0.5), 5.5);
}

function scoreClass(score, low, high) {
  return score >= high ? 'good' : score >= low ? 'ok' : 'bad';
}

async function runBenchmark() {
  const btn = document.getElementById('btnRun');
  btn.disabled = true; btn.textContent = '⏳ RUNNING...'; btn.classList.remove('pulsing');

  const setStatus = t => document.getElementById('benchStatus').textContent = t;
  const setProg   = p => document.getElementById('benchProg').style.width = p + '%';
  const cores     = navigator.hardwareConcurrency || 2;

  // Single core
  setStatus('SINGLE-CORE TEST RUNNING...'); setProg(5);
  await sleep(50);
  const single = await new Promise(res => setTimeout(() => res(benchSingleCore(1200)), 10));
  const singleScore = Math.round(single * 10);
  document.getElementById('scoreSingle').textContent = singleScore;
  document.getElementById('scoreSingle').className = 'score-val ' + scoreClass(singleScore, 800, 2000);
  setProg(35); setStatus('MULTI-CORE TEST RUNNING (' + cores + ' CORES)...');

  // Multi core
  const multi = await benchMultiCore(Math.min(cores, 8), 1200);
  const multiScore = Math.round(multi * 10);
  document.getElementById('scoreMulti').textContent = multiScore;
  document.getElementById('scoreMulti').className = 'score-val ' + scoreClass(multiScore, 2000, 6000);
  setProg(70); setStatus('MEMORY BANDWIDTH TEST...');

  // Memory
  await sleep(50);
  const memMbps = await new Promise(res => setTimeout(() => res(benchMemory()), 10));
  document.getElementById('scoreMem').textContent = memMbps.toLocaleString();
  document.getElementById('scoreMem').className = 'score-val ' + scoreClass(memMbps, 5000, 15000);
  setProg(95); setStatus('CALCULATING...');

  // Estimated GHz
  await sleep(200);
  const ghz = opsToGhz(single);
  animateGhz(ghz);
  setProg(100);

  // Verdict
  const avg = (singleScore / 2000 + multiScore / 6000 + memMbps / 20000) / 3;
  const level = avg >= 0.65 ? 'good' : avg >= 0.35 ? 'ok' : 'bad';
  const labels = {
    good: '✅ FAST DEVICE — Gaming & Streaming Ready',
    ok:   '⚠️ AVERAGE DEVICE — Handles Most Tasks',
    bad:  '❌ SLOW DEVICE — May Struggle with Heavy Apps'
  };
  document.getElementById('benchVerdict').innerHTML =
    `<div class="verdict-chip ${level}">${labels[level]}</div>`;

  setStatus('BENCHMARK COMPLETE');
  btn.disabled = false; btn.textContent = '↻ RE-RUN'; btn.classList.add('pulsing');
}

function animateGhz(target) {
  const el    = document.getElementById('ghzVal');
  const fill  = document.getElementById('ghzFill');
  const label = document.getElementById('ghzLabel');
  const total = 408; // circumference
  const maxGhz = 5.5;
  const t0 = performance.now();
  const dur = 1200;
  const color = target >= 3.5 ? '#00f5a0' : target >= 2.0 ? '#ffb800' : '#ff3d3d';
  fill.style.stroke = color;
  fill.style.filter = `drop-shadow(0 0 6px ${color})`;
  label.style.color = color;

  (function tick(now) {
    const p = Math.min((now - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    const cur = target * e;
    el.textContent = cur.toFixed(2);
    fill.style.strokeDashoffset = total - (cur / maxGhz) * total;
    if (p < 1) requestAnimationFrame(tick);
    else {
      el.textContent = target.toFixed(2);
      label.textContent = target >= 3.5 ? 'HIGH PERFORMANCE' : target >= 2.0 ? 'MID RANGE' : 'LOW END';
    }
  })(performance.now());
}

// ═══ SPECS ════════════════════════════════════════════════════════════════

function val(v, cls) {
  return `<span class="spec-val ${cls||''}">${v}</span>`;
}

function row(key, value, cls) {
  return `<div class="spec-row"><span class="spec-key">${key}</span>${val(value, cls)}</div>`;
}

function section(label, rows) {
  return `<div class="specs-section">
    <div class="specs-section-label">${label}</div>
    ${rows.join('')}
  </div>`;
}

async function collectSpecs() {
  const nav = navigator;
  const ua  = nav.userAgent;
  const scr = window.screen;

  // ── OS + Browser ──
  const getOS = () => {
    if (/Windows NT 10/.test(ua))  return 'Windows 10/11';
    if (/Windows NT 6.3/.test(ua)) return 'Windows 8.1';
    if (/Windows NT 6.1/.test(ua)) return 'Windows 7';
    if (/Mac OS X/.test(ua))       return 'macOS ' + (ua.match(/Mac OS X ([\d_]+)/)?.[1]?.replace(/_/g,'.') || '');
    if (/Android ([\d.]+)/.test(ua)) return 'Android ' + ua.match(/Android ([\d.]+)/)[1];
    if (/iPhone OS ([\d_]+)/.test(ua)) return 'iOS ' + ua.match(/iPhone OS ([\d_]+)/)[1].replace(/_/g,'.');
    if (/iPad.*OS ([\d_]+)/.test(ua))  return 'iPadOS ' + ua.match(/OS ([\d_]+)/)[1].replace(/_/g,'.');
    if (/Linux/.test(ua))          return 'Linux';
    return 'Unknown';
  };

  const getBrowser = () => {
    if (/Edg\//.test(ua))     return 'Microsoft Edge ' + (ua.match(/Edg\/([\d.]+)/)?.[1] || '');
    if (/OPR\//.test(ua))     return 'Opera ' + (ua.match(/OPR\/([\d.]+)/)?.[1] || '');
    if (/Chrome\//.test(ua))  return 'Chrome ' + (ua.match(/Chrome\/([\d.]+)/)?.[1] || '');
    if (/Firefox\//.test(ua)) return 'Firefox ' + (ua.match(/Firefox\/([\d.]+)/)?.[1] || '');
    if (/Safari\//.test(ua))  return 'Safari ' + (ua.match(/Version\/([\d.]+)/)?.[1] || '');
    return 'Unknown';
  };

  const getDevice = () => {
    if (/iPhone/.test(ua)) return 'Apple iPhone';
    if (/iPad/.test(ua))   return 'Apple iPad';
    const m = ua.match(/\(Linux.*?;\s*(.+?)\s*Build/);
    return m ? m[1] : 'Desktop / Unknown';
  };

  // ── CPU ──
  const cores = nav.hardwareConcurrency || 'N/A';

  // ── Memory ──
  const ram = nav.deviceMemory ? nav.deviceMemory + ' GB (approx)' : 'Not disclosed';

  // ── Screen ──
  const dpr    = window.devicePixelRatio || 1;
  const physW  = Math.round(scr.width  * dpr);
  const physH  = Math.round(scr.height * dpr);
  const colorD = scr.colorDepth || scr.pixelDepth || 'N/A';
  const orient = scr.orientation?.type || (scr.width > scr.height ? 'landscape' : 'portrait');

  // ── GPU ──
  let gpu = 'N/A', gpuVendor = 'N/A';
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (gl) {
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      if (ext) {
        gpu       = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || 'N/A';
        gpuVendor = gl.getParameter(ext.UNMASKED_VENDOR_WEBGL)   || 'N/A';
      }
    }
  } catch(e) {}

  // ── Network ──
  const conn = nav.connection || nav.mozConnection || nav.webkitConnection;
  const netType    = conn?.effectiveType?.toUpperCase() || 'N/A';
  const netDL      = conn?.downlink ? conn.downlink + ' Mbps' : 'N/A';
  const netRtt     = conn?.rtt      ? conn.rtt + ' ms'        : 'N/A';
  const saveData   = conn?.saveData ? 'ON' : 'OFF';

  // ── Storage ──
  let storageUsed = 'N/A', storageTotal = 'N/A';
  try {
    if (navigator.storage?.estimate) {
      const est = await navigator.storage.estimate();
      storageUsed  = formatBytes(est.usage  || 0);
      storageTotal = formatBytes(est.quota  || 0);
    }
  } catch(e) {}

  // ── Battery ──
  let battPct = null, battCharging = null, battTime = null;
  try {
    if (nav.getBattery) {
      const b = await nav.getBattery();
      battPct      = Math.round(b.level * 100);
      battCharging = b.charging;
      battTime     = b.chargingTime === Infinity || b.dischargingTime === Infinity ? null
                   : b.charging ? b.chargingTime : b.dischargingTime;
    }
  } catch(e) {}

  // ── Misc ──
  const lang       = nav.language || 'N/A';
  const timeZone   = Intl.DateTimeFormat().resolvedOptions().timeZone || 'N/A';
  const cookieEn   = nav.cookieEnabled ? 'Enabled' : 'Disabled';
  const doNotTrack = nav.doNotTrack === '1' ? 'ON' : 'OFF';
  const touchPts   = nav.maxTouchPoints || 0;
  const onLine     = nav.onLine ? 'Online' : 'Offline';

  // ── Battery HTML ──
  const battHTML = battPct !== null
    ? (() => {
        const bc = battPct >= 50 ? '#00f5a0' : battPct >= 20 ? '#ffb800' : '#ff3d3d';
        const chg = battCharging ? ' ⚡' : '';
        const timeStr = battTime ? ' · ' + Math.round(battTime/60) + 'min' : '';
        return `<span class="battery-inline">
          <span class="spec-val accent">${battPct}%${chg}${timeStr}</span>
          <span class="battery-bar-wrap"><span class="battery-bar" style="width:${battPct}%;background:${bc}"></span></span>
        </span>`;
      })()
    : val('Not supported', 'muted');

  // ── Render ──
  document.getElementById('specsContainer').innerHTML = [
    section('DEVICE & OS', [
      row('Device',      getDevice()),
      row('Operating System', getOS()),
      row('Browser',     getBrowser()),
      row('Language',    lang),
      row('Timezone',    timeZone),
    ]),
    section('CPU & MEMORY', [
      row('CPU Cores',   cores + ' logical cores', cores >= 8 ? 'accent' : cores >= 4 ? '' : 'warn'),
      row('RAM (approx)',ram, nav.deviceMemory >= 8 ? 'accent' : nav.deviceMemory >= 4 ? '' : 'warn'),
      row('Touch Points',touchPts > 0 ? touchPts + ' (touchscreen)' : 'None (desktop)'),
    ]),
    section('DISPLAY', [
      row('Resolution (logical)', scr.width + ' × ' + scr.height + ' px'),
      row('Resolution (physical)',physW + ' × ' + physH + ' px'),
      row('Device Pixel Ratio',   dpr + 'x'),
      row('Color Depth',          colorD + '-bit'),
      row('Orientation',          orient),
    ]),
    section('GPU / GRAPHICS', [
      row('GPU Renderer', gpu,       gpu !== 'N/A' ? 'accent' : 'muted'),
      row('GPU Vendor',   gpuVendor, gpuVendor !== 'N/A' ? '' : 'muted'),
    ]),
    section('NETWORK ADAPTER', [
      row('Connection Type', netType, netType === '4G' || netType === 'WIFI' ? 'accent' : ''),
      row('Downlink Speed',  netDL),
      row('Round Trip Time', netRtt),
      row('Status',          onLine, onLine === 'Online' ? 'accent' : 'warn'),
      row('Data Saver',      saveData, saveData === 'ON' ? 'warn' : ''),
    ]),
    section('STORAGE', [
      row('Cache / App Used', storageUsed),
      row('Storage Quota',    storageTotal),
    ]),
    section('BATTERY', [
      ['<div class="spec-row"><span class="spec-key">Battery</span>' + battHTML + '</div>'],
    ].flat().join('')),
    section('PRIVACY & MISC', [
      row('Cookies',       cookieEn),
      row('Do Not Track',  doNotTrack),
      row('User Agent',    ua.substring(0, 80) + (ua.length > 80 ? '…' : ''), 'muted'),
    ]),
  ].join('');
}

function formatBytes(bytes) {
  if (!bytes) return '0 B';
  const k = 1024;
  const sizes = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Load specs on page open
collectSpecs();
</script>
</body>
</html>
