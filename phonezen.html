<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhoneZen — Phone Specs</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect width='60' height='60' rx='14' fill='%23000'/%3E%3Crect x='18' y='6' width='24' height='48' rx='4' fill='none' stroke='%2300d4ff' stroke-width='2.5'/%3E%3Ccircle cx='30' cy='47' r='2.5' fill='%2300d4ff'/%3E%3Crect x='24' y='10' width='12' height='2' rx='1' fill='%2300d4ff' opacity='0.5'/%3E%3C/svg%3E">

<style>
:root{
  --bg:#000;--panel:#0f0f0f;--panel2:#161616;
  --border:#1e1e1e;--border2:#2a2a2a;
  --accent:#00d4ff;--accent-dim:rgba(0,212,255,0.10);--accent-glow:0 0 22px rgba(0,212,255,0.3);
  --good:#00f5a0;--good-dim:rgba(0,245,160,0.12);
  --warn:#ffb800;--danger:#ff3d3d;
  --white:#fff;--grey2:#888;--grey3:#444;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:#000;}
body{background:var(--bg);color:var(--white);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 48px;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,#1a1a1a 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;top:0;left:50%;transform:translateX(-50%);width:700px;height:300px;background:radial-gradient(ellipse,rgba(0,212,255,0.04) 0%,transparent 70%);pointer-events:none;z-index:0;}
.container{position:relative;z-index:1;width:100%;max-width:720px;}

/* HEADER */
header{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px;}
.logo-row{display:flex;align-items:center;gap:14px;}
.pz-icon{width:52px;height:52px;flex-shrink:0;}
.logo-text{display:flex;flex-direction:column;align-items:flex-start;}
.logo-main{font-size:2rem;font-weight:700;letter-spacing:5px;line-height:1;color:var(--white);}
.logo-main span{color:var(--accent);text-shadow:var(--accent-glow);}
.logo-sub{font-family:'Share Tech Mono',monospace;font-size:0.58rem;letter-spacing:3px;color:var(--grey3);margin-top:3px;}

.back-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border2);color:var(--grey2);border-radius:8px;padding:6px 12px;font-family:'Share Tech Mono',monospace;font-size:0.62rem;letter-spacing:2px;cursor:pointer;text-decoration:none;transition:all 0.2s;margin-bottom:14px;align-self:flex-start;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:14px;}
.search-input{width:100%;background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:13px 44px;font-family:'Share Tech Mono',monospace;font-size:0.78rem;color:var(--white);outline:none;transition:border-color 0.2s;}
.search-input::placeholder{color:var(--grey3);}
.search-input:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:0.4;pointer-events:none;}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--grey3);cursor:pointer;font-size:1rem;display:none;}
.search-clear.show{display:block;}

/* COMPARE BAR */
.compare-bar{background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:none;align-items:center;gap:10px;}
.compare-bar.show{display:flex;}
.compare-slots{display:flex;gap:8px;flex:1;}
.compare-slot{flex:1;background:var(--panel2);border:1px dashed var(--border2);border-radius:8px;padding:6px 10px;font-family:'Share Tech Mono',monospace;font-size:0.6rem;color:var(--grey3);text-align:center;min-height:34px;display:flex;align-items:center;justify-content:center;}
.compare-slot.filled{border-color:var(--accent);color:var(--white);border-style:solid;position:relative;}
.remove-btn{position:absolute;top:-7px;right:-7px;width:16px;height:16px;background:var(--danger);border-radius:50%;border:none;color:#fff;font-size:0.55rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.btn-compare{background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 14px;font-family:'Rajdhani',sans-serif;font-size:0.82rem;font-weight:700;letter-spacing:2px;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
.btn-compare:disabled{background:var(--grey3);cursor:not-allowed;}
.btn-compare:not(:disabled):hover{background:#22e4ff;}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:14px;}
.tab{flex:1;padding:8px 4px;text-align:center;font-family:'Share Tech Mono',monospace;font-size:0.62rem;letter-spacing:2px;color:var(--grey2);cursor:pointer;border-radius:7px;transition:all 0.2s;text-transform:uppercase;border:1px solid transparent;}
.tab.active{background:var(--panel2);color:var(--accent);border-color:var(--border2);box-shadow:var(--accent-glow);}

/* VIEWS */
.view{display:none;}.view.active{display:block;}

/* BRAND GRID */
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:12px;}
.brand-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;transition:all 0.22s;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden;}
.brand-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity 0.2s;}
.brand-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 24px rgba(0,212,255,0.12);}
.brand-card:hover::before{opacity:1;}
.brand-logo{width:44px;height:44px;border-radius:10px;object-fit:contain;background:#fff;padding:5px;}
.brand-logo-fb{width:44px;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--accent);font-weight:700;letter-spacing:1px;}
.brand-name{font-size:0.85rem;font-weight:700;letter-spacing:1px;color:var(--white);}
.brand-count{font-family:'Share Tech Mono',monospace;font-size:0.55rem;color:var(--grey3);}

/* PHONE LIST */
.list-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.btn-back-list{background:transparent;border:1px solid var(--border2);color:var(--grey2);border-radius:7px;padding:6px 10px;font-family:'Share Tech Mono',monospace;font-size:0.6rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-back-list:hover{border-color:var(--accent);color:var(--accent);}
.list-title{font-size:1.1rem;font-weight:700;letter-spacing:3px;color:var(--white);}

.phone-list{display:flex;flex-direction:column;gap:8px;}
.phone-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.2s;}
.phone-item:hover{border-color:var(--accent);background:var(--panel2);}
.phone-thumb{width:42px;height:56px;object-fit:contain;border-radius:6px;background:var(--panel2);flex-shrink:0;}
.phone-thumb-fb{width:42px;height:56px;background:var(--panel2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;border:1px solid var(--border);}
.phone-info{flex:1;min-width:0;}
.phone-name{font-size:0.92rem;font-weight:700;color:var(--white);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.phone-meta{font-family:'Share Tech Mono',monospace;font-size:0.58rem;color:var(--grey2);}
.phone-meta2{font-family:'Share Tech Mono',monospace;font-size:0.56rem;color:var(--grey3);margin-top:2px;}
.phone-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0;}
.btn-specs{background:var(--accent-dim);border:1px solid rgba(0,212,255,0.2);color:var(--accent);border-radius:6px;padding:4px 10px;font-family:'Share Tech Mono',monospace;font-size:0.56rem;letter-spacing:1px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-specs:hover{background:rgba(0,212,255,0.2);}
.btn-cmp{background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.2);color:#a78bfa;border-radius:6px;padding:4px 10px;font-family:'Share Tech Mono',monospace;font-size:0.56rem;letter-spacing:1px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-cmp:hover{background:rgba(124,58,237,0.2);}
.btn-cmp.added{background:var(--good-dim);border-color:rgba(0,245,160,0.25);color:var(--good);}

/* SPECS */
.specs-hero{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;}
.specs-img{width:90px;height:120px;object-fit:contain;border-radius:8px;background:var(--panel2);flex-shrink:0;}
.specs-img-fb{width:90px;height:120px;background:var(--panel2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:3rem;flex-shrink:0;}
.specs-title-wrap{flex:1;}
.specs-name{font-size:1.35rem;font-weight:700;color:var(--white);line-height:1.2;margin-bottom:4px;}
.specs-brand{font-family:'Share Tech Mono',monospace;font-size:0.62rem;color:var(--accent);letter-spacing:2px;margin-bottom:10px;}
.specs-pills{display:flex;gap:5px;flex-wrap:wrap;}
.pill{font-family:'Share Tech Mono',monospace;font-size:0.52rem;padding:3px 8px;border-radius:20px;border:1px solid var(--border2);color:var(--grey2);}
.pill.hl{border-color:rgba(0,212,255,0.25);color:var(--accent);background:var(--accent-dim);}
.pill.good{border-color:rgba(0,245,160,0.25);color:var(--good);background:var(--good-dim);}

.specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media(max-width:500px){.specs-grid{grid-template-columns:1fr;}}
.spec-block{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;}
.sb-title{font-size:0.57rem;letter-spacing:3px;color:var(--accent);text-transform:uppercase;font-family:'Share Tech Mono',monospace;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.sb-row{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:1px solid #0d0d0d;gap:10px;}
.sb-row:last-child{border-bottom:none;}
.sb-k{font-family:'Share Tech Mono',monospace;font-size:0.58rem;color:var(--grey2);flex-shrink:0;}
.sb-v{font-family:'Share Tech Mono',monospace;font-size:0.64rem;color:var(--white);font-weight:600;text-align:right;word-break:break-word;}
.sb-v.g{color:var(--good);}
.sb-v.w{color:var(--warn);}

/* COMPARE */
.cmp-phones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.cmp-head{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.cmp-head-img{width:60px;height:80px;object-fit:contain;margin:0 auto 8px;display:block;border-radius:6px;}
.cmp-head-name{font-size:0.88rem;font-weight:700;color:var(--white);margin-bottom:2px;}
.cmp-head-brand{font-family:'Share Tech Mono',monospace;font-size:0.55rem;color:var(--accent);letter-spacing:2px;}
.cmp-section-title{font-size:0.57rem;letter-spacing:3px;color:var(--grey3);text-transform:uppercase;font-family:'Share Tech Mono',monospace;padding:8px 0 6px;border-top:1px solid var(--border);margin-bottom:6px;}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.cmp-cell{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 10px;text-align:center;}
.cmp-cell.winner{background:var(--good-dim);border-color:rgba(0,245,160,0.25);}
.cmp-key{font-family:'Share Tech Mono',monospace;font-size:0.5rem;color:var(--grey3);margin-bottom:3px;letter-spacing:1px;}
.cmp-val{font-family:'Share Tech Mono',monospace;font-size:0.7rem;font-weight:700;color:var(--white);}
.cmp-cell.winner .cmp-val{color:var(--good);}

/* SEARCH & LOADING */
.no-results{font-family:'Share Tech Mono',monospace;font-size:0.72rem;color:var(--grey3);text-align:center;padding:30px 0;}
.loading{font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:var(--grey3);text-align:center;padding:24px 0;display:flex;align-items:center;justify-content:center;gap:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
.source-badge{font-family:'Share Tech Mono',monospace;font-size:0.52rem;color:var(--grey3);text-align:center;margin-top:10px;}
.source-badge span{color:var(--accent);}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0.15}}
.ldot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--grey3);animation:blink 1s infinite;margin:0 2px;}
footer{text-align:center;font-family:'Share Tech Mono',monospace;font-size:0.57rem;color:var(--grey3);margin-top:20px;letter-spacing:3px;}
</style>
</head>

const ALL_PHONES = Object.values(DB).flat();
let compareList = [];
let currentBrand = null;
let specsFrom = 'brands';

// ═══ COMPARE WIN LOGIC ════════════════════════════════════════════════════
// Extract first numeric value from a string like "50MP+48MP+12MP" or "5000mAh"
function extractNum(str='') {
  const m = str.match(/[\d.]+/);
  return m ? parseFloat(m[0]) : null;
}

// Fields where higher = better
const HIGHER_BETTER = ['display','ram','storage','rear_cam','front_cam','battery','charging'];
// Fields where lower = better
const LOWER_BETTER  = ['weight','thickness'];

function getWinner(key, va, vb) {
  const na = extractNum(va), nb = extractNum(vb);
  if (na === null || nb === null || na === nb) return null;
  if (HIGHER_BETTER.includes(key)) return na > nb ? 'a' : 'b';
  if (LOWER_BETTER.includes(key))  return na < nb ? 'a' : 'b';
  return null;
}

// ═══ SUPABASE FETCH ═══════════════════════════════════════════════════════
async function fetchFromSupabase(brand_slug) {
  if (!sb || SUPABASE_URL === 'YOUR_SUPABASE_URL') return null;
  try {
    const { data, error } = await sb.from('phones')
      .select('*').eq('brand_slug', brand_slug).order('year', { ascending: false });
    if (error) return null;
    return data;
  } catch(e) { return null; }
}

async function trackView(phone_id) {
  if (!sb || SUPABASE_URL === 'YOUR_SUPABASE_URL') return;
  try { await sb.from('analytics').insert({ phone_id, event: 'view' }); } catch(e) {}
}

async function trackCompare(id_a, id_b) {
  if (!sb || SUPABASE_URL === 'YOUR_SUPABASE_URL') return;
  try { await sb.from('analytics').insert([{ phone_id:id_a, event:'compare' },{ phone_id:id_b, event:'compare' }]); } catch(e) {}
}

// ═══ RENDER BRANDS ════════════════════════════════════════════════════════
function renderBrands() {
  document.getElementById('brandGrid').innerHTML = BRANDS.map(b => {
    const count = (DB[b.slug]||[]).length;
    const logoHtml = b.logo
      ? `<img class="brand-logo" src="${b.logo}" alt="${b.name}" onerror="this.outerHTML='<div class=brand-logo-fb>${b.name.substring(0,2).toUpperCase()}</div>'">`
      : `<div class="brand-logo-fb">${b.name.substring(0,2).toUpperCase()}</div>`;
    return `<div class="brand-card" onclick="openBrand('${b.slug}','${b.name}')">
      ${logoHtml}
      <div class="brand-name">${b.name}</div>
      <div class="brand-count">${count} phones</div>
    </div>`;
  }).join('');
}

// ═══ OPEN BRAND ═══════════════════════════════════════════════════════════
async function openBrand(slug, name) {
  currentBrand = { slug, name };
  specsFrom = 'list';
  document.getElementById('listTitle').textContent = name.toUpperCase();
  document.getElementById('phoneList').innerHTML = `<div class="loading"><div class="spinner"></div>LOADING...</div>`;
  showView('viewList');

  // Try Supabase first
  const remote = await fetchFromSupabase(slug);
  const phones  = (remote && remote.length) ? remote : (DB[slug]||[]);
  const source  = (remote && remote.length) ? 'supabase' : 'local';

  document.getElementById('phoneList').innerHTML =
    phones.length ? phones.map(p => phoneItemHTML(p)).join('')
    : '<div class="no-results">// No phones found.</div>';

  if (source === 'supabase') {
    document.getElementById('phoneList').insertAdjacentHTML('afterbegin',
      `<div class="source-badge">Data from <span>Supabase</span></div>`);
  }
}

// ═══ PHONE ITEM HTML ══════════════════════════════════════════════════════
function phoneItemHTML(p) {
  const inCmp = compareList.some(c => c.id === p.id);
  const imgHtml = p.img
    ? `<img class="phone-thumb" src="${p.img}" alt="${p.name}" onerror="this.outerHTML='<div class=phone-thumb-fb>📱</div>'">`
    : `<div class="phone-thumb-fb">📱</div>`;
  const s = p.specs||{};
  return `<div class="phone-item">
    ${imgHtml}
    <div class="phone-info">
      <div class="phone-name">${p.name}</div>
      <div class="phone-meta">${p.brand||''} · ${p.year} · ${s.network||''}</div>
      <div class="phone-meta2">${s.chipset||''} · ${s.ram||''} RAM</div>
    </div>
    <div class="phone-actions">
      <button class="btn-specs" onclick="openSpecs('${p.id}')">SPECS</button>
      <button class="btn-cmp ${inCmp?'added':''}" onclick="toggleCompare('${p.id}')">${inCmp?'✓ ADDED':'+ COMPARE'}</button>
    </div>
  </div>`;
}

// ═══ SPECS ════════════════════════════════════════════════════════════════
function openSpecs(id) {
  const p = ALL_PHONES.find(x => x.id === id);
  if (!p) return;
  trackView(p.id);
  const s = p.specs||{};
  const imgHtml = p.img
    ? `<img class="specs-img" src="${p.img}" alt="${p.name}" onerror="this.outerHTML='<div class=specs-img-fb>📱</div>'">`
    : `<div class="specs-img-fb">📱</div>`;

  document.getElementById('specsContent').innerHTML = `
    <div class="specs-hero">
      ${imgHtml}
      <div class="specs-title-wrap">
        <div class="specs-name">${p.name}</div>
        <div class="specs-brand">${(p.brand||'').toUpperCase()} · ${p.year}</div>
        <div class="specs-pills">
          <span class="pill hl">${s.network||'—'}</span>
          <span class="pill hl">${s.ram||'—'} RAM</span>
          <span class="pill good">${s.battery||'—'}</span>
          <span class="pill">${s.os||'—'}</span>
          <span class="pill">${s.storage||'—'}</span>
        </div>
      </div>
    </div>
    <div class="specs-grid">
      ${sBlock('DISPLAY',   [['Panel',s.display]])}
      ${sBlock('PROCESSOR', [['Chipset',s.chipset],['RAM',s.ram,'g'],['Storage',s.storage]])}
      ${sBlock('CAMERA',    [['Rear',s.rear_cam],['Front',s.front_cam,'g']])}
      ${sBlock('BATTERY',   [['Capacity',s.battery,'g'],['Charging',s.charging]])}
      ${sBlock('OS & NET',  [['OS',s.os],['Network',s.network,s.network==='5G'?'g':'']])}
      ${sBlock('BUILD',     [['Weight',s.weight],['Thickness',s.thickness],['Colors',s.colors]])}
    </div>`;

  showView('viewSpecs');
}

function sBlock(title, rows) {
  return `<div class="spec-block">
    <div class="sb-title">${title}</div>
    ${rows.map(([k,v,c])=>`<div class="sb-row"><span class="sb-k">${k}</span><span class="sb-v ${c||''}">${v||'N/A'}</span></div>`).join('')}
  </div>`;
}

function goBackFromSpecs() {
  specsFrom === 'list' && currentBrand ? showView('viewList') : showView('viewSearch');
}

// ═══ COMPARE ══════════════════════════════════════════════════════════════
function toggleCompare(id) {
  const p = ALL_PHONES.find(x => x.id === id);
  if (!p) return;
  const idx = compareList.findIndex(c => c.id === id);
  if (idx >= 0) compareList.splice(idx, 1);
  else {
    if (compareList.length >= 2) { alert('Remove one phone first to add another.'); return; }
    compareList.push(p);
  }
  updateCompareBar();
  refreshCurrentList();
}

function updateCompareBar() {
  const bar = document.getElementById('compareBar');
  bar.classList.toggle('show', compareList.length > 0);
  [0,1].forEach(i => {
    const slot = document.getElementById('slot'+i);
    if (compareList[i]) {
      slot.className = 'compare-slot filled';
      slot.innerHTML = `<span style="font-size:0.62rem;padding:0 12px 0 4px">${compareList[i].name}</span>
        <button class="remove-btn" onclick="toggleCompare('${compareList[i].id}')">✕</button>`;
    } else {
      slot.className = 'compare-slot';
      slot.innerHTML = 'Phone '+(i+1);
    }
  });
  document.getElementById('btnCompare').disabled = compareList.length < 2;
}

function refreshCurrentList() {
  const active = document.querySelector('.view.active');
  if (!active) return;
  if (active.id === 'viewList' && currentBrand) {
    document.getElementById('phoneList').innerHTML =
      (DB[currentBrand.slug]||[]).map(p => phoneItemHTML(p)).join('');
  } else if (active.id === 'viewSearch') {
    handleSearch(document.getElementById('searchInput').value, true);
  }
}

function showComparison() {
  if (compareList.length < 2) return;
  trackCompare(compareList[0].id, compareList[1].id);
  const [a, b] = compareList;
  const sa = a.specs||{}, sb2 = b.specs||{};

  const SECTIONS = [
    { title:'DISPLAY',   keys:['display'] },
    { title:'PROCESSOR', keys:['chipset','ram','storage'] },
    { title:'CAMERA',    keys:['rear_cam','front_cam'] },
    { title:'BATTERY',   keys:['battery','charging'] },
    { title:'OS & NETWORK', keys:['os','network'] },
    { title:'BUILD',     keys:['weight','thickness'] },
  ];

  const imgA = a.img ? `<img class="cmp-head-img" src="${a.img}" onerror="this.style.display='none'">` : '';
  const imgB = b.img ? `<img class="cmp-head-img" src="${b.img}" onerror="this.style.display='none'">` : '';

  let html = `<div class="cmp-phones">
    <div class="cmp-head">${imgA}<div class="cmp-head-name">${a.name}</div><div class="cmp-head-brand">${(a.brand||'').toUpperCase()} · ${a.year}</div></div>
    <div class="cmp-head">${imgB}<div class="cmp-head-name">${b.name}</div><div class="cmp-head-brand">${(b.brand||'').toUpperCase()} · ${b.year}</div></div>
  </div>`;

  SECTIONS.forEach(sec => {
    html += `<div class="cmp-section-title">${sec.title}</div>`;
    sec.keys.forEach(key => {
      const va = sa[key]||'N/A', vb = sb2[key]||'N/A';
      const winner = getWinner(key, va, vb);
      const ca = winner==='a'?'winner':'', cb = winner==='b'?'winner':'';
      const label = key.replace(/_/g,' ').toUpperCase();
      html += `<div class="cmp-row">
        <div class="cmp-cell ${ca}"><div class="cmp-key">${label}</div><div class="cmp-val">${va}</div></div>
        <div class="cmp-cell ${cb}"><div class="cmp-key">${label}</div><div class="cmp-val">${vb}</div></div>
      </div>`;
    });
  });

  document.getElementById('compareContent').innerHTML = html;
  showView('viewCompare');
}

function goBackFromCompare() {
  currentBrand ? showView('viewList') : showView('viewBrands');
}

// ═══ SEARCH ═══════════════════════════════════════════════════════════════
let searchT;
function handleSearch(q, silent=false) {
  if (!silent) document.getElementById('searchClear').classList.toggle('show', q.length > 0);
  clearTimeout(searchT);
  if (!q.trim()) { if (!silent) { switchTab('brands'); showView('viewBrands'); } return; }
  if (!silent) switchTab('search');
  searchT = setTimeout(() => {
    const ql = q.toLowerCase();
    const res = ALL_PHONES.filter(p =>
      p.name.toLowerCase().includes(ql) ||
      (p.brand||'').toLowerCase().includes(ql) ||
      (p.specs?.chipset||'').toLowerCase().includes(ql) ||
      String(p.year).includes(ql)
    );
    specsFrom = 'search';
    document.getElementById('searchResults').innerHTML = res.length
      ? res.map(p => phoneItemHTML(p)).join('')
      : `<div class="no-results">// No results for "${q}"</div>`;
    if (!silent) showView('viewSearch');
  }, 220);
}

function clearSearch() {
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').classList.remove('show');
  switchTab('brands'); showView('viewBrands');
}

// ═══ VIEW & TAB HELPERS ═══════════════════════════════════════════════════
function showView(id) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function switchTab(t) {
  document.getElementById('tabBrands').classList.toggle('active', t==='brands');
  document.getElementById('tabSearch').classList.toggle('active', t==='search');
}

// ═══ INIT ═════════════════════════════════════════════════════════════════
renderBrands();
</script>
